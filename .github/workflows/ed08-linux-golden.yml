name: ED-08 Linux representative golden

on:
  pull_request:
    branches: [main]

jobs:
  generate-linux-golden:
    if: github.event.pull_request.number == 115
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@11.17.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render Linux representative frames
        env:
          UPDATE_REPRESENTATIVE_GOLDENS: "1"
        run: pnpm test -- tests/e2e/project-rendering.e2e.test.ts

      - name: Upload Linux representative frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ed08-linux-representative-frames
          path: tests/fixtures/representative-frames/linux/*.png
          if-no-files-found: error
