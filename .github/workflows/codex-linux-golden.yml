name: Codex Linux representative golden

on:
  push:
    branches:
      - codex/issue-180-rf01

jobs:
  generate-linux-golden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Linux representative goldens
        env:
          UPDATE_REPRESENTATIVE_GOLDENS: "1"
        run: pnpm test -- tests/e2e/project-rendering.e2e.test.ts

      - name: Upload Linux representative goldens
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-representative-goldens
          path: tests/fixtures/representative-frames/linux/*.png
